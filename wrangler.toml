# Cloudflare Workers Static Assets configuration.
#
# The demo is a static bundle with no server-side code, so there is no `main`
# entry point — Cloudflare serves `dist/` directly. `_headers` in `public/`
# still applies for caching and security headers.
name = "casino"
compatibility_date = "2026-08-31"

[assets]
directory = "./dist"
# Unknown paths return the app shell instead of a 404.
not_found_handling = "single-page-application"
