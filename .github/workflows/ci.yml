name: CI

# Deployment is handled by Cloudflare's own build pipeline, which is connected
# to this repository. This workflow only guards the branch: it type-checks and
# builds so a broken commit is caught before Cloudflare tries to ship it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` type-checks first, so a type error fails the job.
      - run: npm run build
